[package]
name = "chess"
version = "6.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = ["stockfish-nnue"]
# Stockfish 18's networks and the code that evaluates them.
stockfish-nnue = []

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
byteorder = "1.4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Noisy: pure functions and documented error types say enough.
must_use_candidate = "allow"
missing_errors_doc = "allow"
# The search's hot path is inlined on purpose; change it only with a benchmark.
inline_always = "allow"
# Board, eval and network code converts between square, score and weight
# widths on purpose; newtypes are replacing these casts.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
# mul_add would change floating-point results that tests and tuning rely on.
suboptimal_flops = "allow"
# Chess names come in families (from/to, wtime/btime) that this flags.
similar_names = "allow"
# map_or_else reads worse than if let ... else for most of these.
option_if_let_else = "allow"
# Fields carry their units (white_ms, black_ms), as the names should.
struct_field_names = "allow"
# Every map here uses the default hasher.
implicit_hasher = "allow"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
