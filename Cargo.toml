[package]
name = "chess"
version = "6.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
num_cpus = "1.16.0"
byteorder = "1.4"
once_cell = "*"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[target.x86_64-unknown-linux-gnu.release]
rustflags = ["-C", "relocation-model=static"]
